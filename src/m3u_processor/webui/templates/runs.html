{% extends "base.html" %}
{% block title %}Run History{% endblock %}
{% block body_attr %} data-page="runs"{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Run History</h1>
    <div class="sub">Timeline of all validation runs.</div>
  </div>
</div>

<div class="toolbar">
  <div class="field"><span>Mode</span>
    <select id="f-mode">
      <option value="">all</option>
      <option value="full">full</option>
      <option value="refresh">refresh</option>
      <option value="regular">regular</option>
      <option value="quick">quick</option>
    </select>
  </div>
  <div class="field"><span>Status</span>
    <select id="f-status">
      <option value="">all</option>
      <option value="completed">completed</option>
      <option value="stopped">stopped</option>
      <option value="running">running</option>
      <option value="discarded">discarded</option>
    </select>
  </div>
  <div class="field"><span>Search</span><input id="f-q" type="search" placeholder="search run_id / stats"></div>
</div>
<div id="timeline" class="timeline"></div>
{% endblock %}
{% block scripts %}
<script>
function loadRuns() {
  const mode = document.getElementById("f-mode").value;
  const status = document.getElementById("f-status").value;
  const q = document.getElementById("f-q").value.toLowerCase();
  apiGet("/api/runs?limit=200&mode=" + encodeURIComponent(mode) + "&status=" + encodeURIComponent(status))
    .then(rows => {
      const el = document.getElementById("timeline");
      let html = "";
      rows.filter(r => {
        if (!q) return true;
        return (r.run_id + " " + (r.publish_error || "")).toLowerCase().includes(q);
      }).forEach(r => {
        const s = r.stats || {};
        const reason = s.reason ? `<span class="pill bad" title="discarded">${esc(s.reason)}</span>` : "";
        const pub = r.status === "discarded" ? "" :
          (r.publish_error
            ? `<span class="pill warn" title="${esc(r.publish_error)}">publish ⚠</span>`
            : `<span class="pill ok">published</span>`);
        html += `<div class="tl-item">
          <div class="tl-dot ${esc(r.status)}"></div>
          <div class="tl-card">
            <div class="tl-head">
              <strong>${esc(r.mode)}</strong> ${statusPill(r.status)} ${pub} ${reason}
              <span class="tl-time">${fmtTime(r.started_at)}</span>
            </div>
            <div class="tl-meta">duration ${fmtDur(r.duration_seconds)} · run_id ${esc(r.run_id)}</div>
            <div class="tl-stats">
              checked <b>${s.checked ?? 0}</b> · working <b>${s.working ?? 0}</b> ·
              failed <b>${s.failed ?? 0}</b> · token_refreshed <b>${s.token_refreshed ?? 0}</b>
            </div>
          </div>
        </div>`;
      });
      el.innerHTML = html || `<p class="muted">No runs match.</p>`;
    });
}
['f-mode', 'f-status'].forEach(id => document.getElementById(id).addEventListener('change', loadRuns));
document.getElementById('f-q').addEventListener('input', debounce(loadRuns, 300));
loadRuns();
setInterval(loadRuns, 15000);
</script>
{% endblock %}
