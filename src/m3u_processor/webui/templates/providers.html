{% extends "base.html" %}
{% block title %}Providers{% endblock %}
{% block content %}
<style>
  .provider-stats { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .provider-stats .chip { font-size:0.72rem; padding:2px 7px; border-radius:4px; white-space:nowrap; }
  .chip-total { background:#334155; color:#cbd5e1; }
  .chip-working { background:#14532d; color:#86efac; }
  .chip-failed { background:#7f1d1d; color:#fca5a5; }
  .chip-unchecked { background:#4a4458; color:#c4b5fd; }
  .chip-bs { background:#78350f; color:#fcd34d; }
  .chip-bp { background:#7f1d1d; color:#fca5a5; }
  .chip-healthy { background:#064e3b; color:#6ee7b7; }
  .chip-medium { background:#713f12; color:#fde68a; }
  .chip-slow { background:#7f1d1d; color:#fca5a5; }
  .state-enabled { color:#22c55e; font-weight:600; }
  .state-disabled { color:#ef4444; font-weight:600; }
  .action-btn { padding:4px 12px; border-radius:4px; border:none; cursor:pointer; font-size:0.8rem; }
  .btn-disable { background:#dc2626; color:#fff; }
  .btn-enable { background:#16a34a; color:#fff; }
  .btn-disable:hover { background:#b91c1c; }
  .btn-enable:hover { background:#15803d; }
  .summary-bar { display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .summary-item { font-size:0.85rem; color:#94a3b8; }
  .summary-item strong { color:#e2e8f0; }
  .pagination { display:flex; gap:6px; align-items:center; justify-content:center; margin-top:16px; }
  .pagination button { padding:4px 10px; border-radius:4px; border:1px solid #475569; background:#1e293b; color:#e2e8f0; cursor:pointer; font-size:0.8rem; }
  .pagination button:disabled { opacity:0.4; cursor:default; }
  .pagination button.active { background:#3b82f6; border-color:#3b82f6; color:#fff; }
  .pagination span { color:#94a3b8; font-size:0.85rem; }
</style>

<h1>Providers</h1>
<div class="summary-bar" id="summary"></div>

<div style="margin-bottom:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
  <input id="providerSearch" placeholder="Search provider..." style="padding:6px 10px; border-radius:4px; border:1px solid #475569; background:#1e293b; color:#e2e8f0; min-width:200px;">
  <select id="filterState" style="padding:6px; border-radius:4px; border:1px solid #475569; background:#1e293b; color:#e2e8f0;">
    <option value="">All States</option>
    <option value="enabled">Enabled Only</option>
    <option value="disabled">Disabled Only</option>
  </select>
  <select id="sortBy" style="padding:6px; border-radius:4px; border:1px solid #475569; background:#1e293b; color:#e2e8f0;">
    <option value="streams-desc">Sort: Most Streams</option>
    <option value="streams-asc">Sort: Fewest Streams</option>
    <option value="working-desc">Sort: Most Working</option>
    <option value="name-asc">Sort: Name A-Z</option>
    <option value="name-desc">Sort: Name Z-A</option>
  </select>
  <span id="resultCount" style="color:#64748b; font-size:0.85rem;"></span>
</div>

<table class="tbl" id="providers">
  <thead>
    <tr>
      <th>Provider</th>
      <th>Streams</th>
      <th style="text-align:center">Working</th>
      <th style="text-align:center">Failed</th>
      <th style="text-align:center">Unchecked</th>
      <th style="text-align:center">Health</th>
      <th style="text-align:center">Blacklist</th>
      <th>State</th>
      <th>Reason</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<div class="pagination" id="pagination"></div>

<script>
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

let currentPage = 1;
let debounceTimer = null;
let _providers = [];

function debounce(fn, ms) {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(fn, ms);
}

function loadProviders(page) {
  currentPage = page || 1;
  const search = (document.getElementById('providerSearch').value || '').trim();
  const state = document.getElementById('filterState').value;
  const sort = document.getElementById('sortBy').value;
  const params = new URLSearchParams({search, state, sort, page: currentPage, per_page: 50});

  fetch('/api/providers?' + params).then(r => r.json()).then(data => {
    const rows = data.providers;
    _providers = rows;
    const t = data.totals || {};
    document.getElementById('summary').innerHTML = `
      <span class="summary-item"><strong>${(t.total_providers||0).toLocaleString()}</strong> providers</span>
      <span class="summary-item"><strong>${(t.total_streams||0).toLocaleString()}</strong> total streams</span>
      <span class="summary-item"><strong style="color:#86efac">${(t.working||0).toLocaleString()}</strong> working</span>
      <span class="summary-item"><strong style="color:#fca5a5">${(t.failed||0).toLocaleString()}</strong> failed</span>
      <span class="summary-item"><strong style="color:#c4b5fd">${(t.unchecked||0).toLocaleString()}</strong> unchecked</span>
      <span class="summary-item"><strong style="color:#fcd34d">${t.blacklist_short||0}</strong> blacklist-short</span>
      <span class="summary-item"><strong style="color:#fca5a5">${t.blacklist_permanent||0}</strong> blacklist-perm</span>
    `;
    document.getElementById('resultCount').textContent =
      `Showing ${rows.length} of ${data.total} providers (page ${data.page}/${data.total_pages})`;

    const tb = document.querySelector('#providers tbody');
    tb.innerHTML = rows.map(r => {
      const healthParts = [];
      if (r.healthy) healthParts.push(`<span class="chip chip-healthy" title="Healthy">${r.healthy}</span>`);
      if (r.medium) healthParts.push(`<span class="chip chip-medium" title="Medium">${r.medium}</span>`);
      if (r.slow) healthParts.push(`<span class="chip chip-slow" title="Slow">${r.slow}</span>`);

      const blParts = [];
      if (r.blacklist_short) blParts.push(`<span class="chip chip-bs" title="Short blacklist">${r.blacklist_short}</span>`);
      if (r.blacklist_permanent) blParts.push(`<span class="chip chip-bp" title="Permanent blacklist">${r.blacklist_permanent}</span>`);

      return `<tr>
        <td><a href="/streams?provider=${encodeURIComponent(r.domain)}" style="color:#93c5fd;text-decoration:none;font-weight:600;" title="View streams for ${esc(r.domain)}">${esc(r.domain)}</a></td>
        <td><span class="chip chip-total">${r.total_streams}</span></td>
        <td style="text-align:center"><span class="chip chip-working">${r.working}</span></td>
        <td style="text-align:center"><span class="chip chip-failed">${r.failed}</span></td>
        <td style="text-align:center"><span class="chip chip-unchecked">${r.unchecked}</span></td>
        <td style="text-align:center"><div class="provider-stats">${healthParts.join('') || '<span class="chip" style="background:#334155;color:#64748b">-</span>'}</div></td>
        <td style="text-align:center"><div class="provider-stats">${blParts.join('') || '<span class="chip" style="background:#334155;color:#64748b">-</span>'}</div></td>
        <td class="${r.enabled ? 'state-enabled' : 'state-disabled'}">${r.enabled ? 'ENABLED' : 'DISABLED'}</td>
        <td style="color:#94a3b8; font-size:0.85rem;">${esc(r.disabled_reason || '')}</td>
        <td>${r.enabled
          ? `<button class="action-btn btn-disable" data-idx="${rows.indexOf(r)}" onclick="disable(this)">Disable</button>`
          : `<button class="action-btn btn-enable" data-idx="${rows.indexOf(r)}" onclick="enable(this)">Enable</button>`}</td>
      </tr>`;
    }).join('');

    renderPagination(data.total_pages, data.page);
  });
}

function renderPagination(totalPages, current) {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  let html = '';
  html += `<button ${current<=1?'disabled':''} onclick="loadProviders(${current-1})">&laquo; Prev</button>`;
  const start = Math.max(1, current - 3);
  const end = Math.min(totalPages, current + 3);
  if (start > 1) html += `<button onclick="loadProviders(1)">1</button>`;
  if (start > 2) html += `<span>...</span>`;
  for (let i = start; i <= end; i++) {
    html += `<button class="${i===current?'active':''}" onclick="loadProviders(${i})">${i}</button>`;
  }
  if (end < totalPages - 1) html += `<span>...</span>`;
  if (end < totalPages) html += `<button onclick="loadProviders(${totalPages})">${totalPages}</button>`;
  html += `<button ${current>=totalPages?'disabled':''} onclick="loadProviders(${current+1})">Next &raquo;</button>`;
  el.innerHTML = html;
}

function disable(btn) {
  const d = _providers[+btn.dataset.idx].domain;
  fetch('/api/provider/disable', {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({domain:d, reason:'web'})}).then(() => loadProviders(currentPage));
}
function enable(btn) {
  const d = _providers[+btn.dataset.idx].domain;
  fetch('/api/provider/enable', {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({domain:d})}).then(() => loadProviders(currentPage));
}

document.getElementById('providerSearch').addEventListener('input', () => debounce(() => loadProviders(1), 300));
document.getElementById('filterState').addEventListener('change', () => loadProviders(1));
document.getElementById('sortBy').addEventListener('change', () => loadProviders(1));

loadProviders(1);
</script>
{% endblock %}
