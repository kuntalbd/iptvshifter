{% extends "base.html" %}
{% block title %}Providers{% endblock %}
{% block content %}
<h1>Providers</h1>
<table class="tbl" id="providers">
  <thead><tr><th>Domain</th><th>State</th><th>Reason</th><th>Action</th></tr></thead>
  <tbody></tbody>
</table>
<script>
function loadProviders(){
  fetch('/api/providers').then(r=>r.json()).then(rows=>{
    const tb=document.querySelector('#providers tbody');
    tb.innerHTML=rows.map(r=>`<tr><td>${esc(r.domain)}</td>
      <td class="${r.enabled?'on':'off'}">${r.enabled?'ENABLED':'DISABLED'}</td>
      <td>${esc(r.disabled_reason||'')}</td>
      <td>${r.enabled
        ? `<button onclick="disable('${esc(r.domain)}')">Disable</button>`
        : `<button onclick="enable('${esc(r.domain)}')">Enable</button>`}</td></tr>`).join('');
  });
}
function disable(d){
  fetch('/api/provider/disable',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({domain:d,reason:'web'})}).then(loadProviders);
}
function enable(d){
  fetch('/api/provider/enable',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({domain:d})}).then(loadProviders);
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
loadProviders();
</script>
{% endblock %}
