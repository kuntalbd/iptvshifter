{% extends "base.html" %}
{% block title %}Providers{% endblock %}
{% block content %}
<h1>Providers</h1>
<div class="summary-bar" id="summary"></div>

<div class="row" style="margin-bottom:10px">
  <input id="providerSearch" placeholder="Search provider..." class="filter-input">
  <select id="filterState">
    <option value="">All States</option>
    <option value="enabled">Enabled Only</option>
    <option value="disabled">Disabled Only</option>
  </select>
  <select id="sortBy">
    <option value="streams-desc">Sort: Most Streams</option>
    <option value="streams-asc">Sort: Fewest Streams</option>
    <option value="working-desc">Sort: Most Working</option>
    <option value="name-asc">Sort: Name A-Z</option>
    <option value="name-desc">Sort: Name Z-A</option>
  </select>
  <span id="resultCount" class="result-count"></span>
</div>

<table class="tbl" id="providers">
  <thead>
    <tr>
      <th>Provider</th>
      <th>Streams</th>
      <th style="text-align:center">Working</th>
      <th style="text-align:center">Failed</th>
      <th style="text-align:center">Unchecked</th>
      <th style="text-align:center">Health</th>
      <th style="text-align:center">Blacklist</th>
      <th>State</th>
      <th>Reason</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<div class="pagination" id="pagination"></div>

<script>
let currentPage = 1;
let debounceTimer = null;
let _providers = [];

function loadProviders(page) {
  currentPage = page || 1;
  const search = (document.getElementById('providerSearch').value || '').trim();
  const state = document.getElementById('filterState').value;
  const sort = document.getElementById('sortBy').value;
  const params = new URLSearchParams({search, state, sort, page: currentPage, per_page: 50});

  apiGet('/api/providers?' + params).then(data => {
    const rows = data.providers;
    _providers = rows;
    const t = data.totals || {};
    document.getElementById('summary').innerHTML = `
      <span class="summary-item"><strong>${(t.total_providers||0).toLocaleString()}</strong> providers</span>
      <span class="summary-item"><strong>${(t.total_streams||0).toLocaleString()}</strong> total streams</span>
      <span class="summary-item"><strong class="c-ok">${(t.working||0).toLocaleString()}</strong> working</span>
      <span class="summary-item"><strong class="c-bad">${(t.failed||0).toLocaleString()}</strong> failed</span>
      <span class="summary-item"><strong class="c-purple">${(t.unchecked||0).toLocaleString()}</strong> unchecked</span>
      <span class="summary-item"><strong class="c-amber">${t.blacklist_short||0}</strong> blacklist-short</span>
      <span class="summary-item"><strong class="c-bad">${t.blacklist_permanent||0}</strong> blacklist-perm</span>
    `;
    document.getElementById('resultCount').textContent =
      `Showing ${rows.length} of ${data.total} providers (page ${data.page}/${data.total_pages})`;

    const tb = document.querySelector('#providers tbody');
    tb.innerHTML = rows.map(r => {
      const healthParts = [];
      if (r.healthy) healthParts.push(`<span class="chip chip-healthy" title="Healthy">${r.healthy}</span>`);
      if (r.medium) healthParts.push(`<span class="chip chip-medium" title="Medium">${r.medium}</span>`);
      if (r.slow) healthParts.push(`<span class="chip chip-slow" title="Slow">${r.slow}</span>`);

      const blParts = [];
      if (r.blacklist_short) blParts.push(`<span class="chip chip-bs" title="Short blacklist">${r.blacklist_short}</span>`);
      if (r.blacklist_permanent) blParts.push(`<span class="chip chip-bp" title="Permanent blacklist">${r.blacklist_permanent}</span>`);

      return `<tr>
        <td><a href="/streams?provider=${encodeURIComponent(r.domain)}" class="prov-link" title="View streams for ${esc(r.domain)}">${esc(r.domain)}</a></td>
        <td><span class="chip chip-total">${r.total_streams}</span></td>
        <td class="ta-c"><span class="chip chip-working">${r.working}</span></td>
        <td class="ta-c"><span class="chip chip-failed">${r.failed}</span></td>
        <td class="ta-c"><span class="chip chip-unchecked">${r.unchecked}</span></td>
        <td class="ta-c"><div class="provider-stats">${healthParts.join('') || '<span class="chip chip-dim">-</span>'}</div></td>
        <td class="ta-c"><div class="provider-stats">${blParts.join('') || '<span class="chip chip-dim">-</span>'}</div></td>
        <td class="${r.enabled ? 'state-enabled' : 'state-disabled'}">${r.enabled ? 'ENABLED' : 'DISABLED'}</td>
        <td class="reason">${esc(r.disabled_reason || '')}</td>
        <td>${r.enabled
          ? `<button class="action-btn btn-disable" data-idx="${rows.indexOf(r)}" onclick="disable(this)">Disable</button>`
          : `<button class="action-btn btn-enable" data-idx="${rows.indexOf(r)}" onclick="enable(this)">Enable</button>`}</td>
      </tr>`;
    }).join('');

    renderPagination(data.total_pages, data.page);
  });
}

function renderPagination(totalPages, current) {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  let html = '';
  html += `<button ${current<=1?'disabled':''} onclick="loadProviders(${current-1})">&laquo; Prev</button>`;
  const start = Math.max(1, current - 3);
  const end = Math.min(totalPages, current + 3);
  if (start > 1) html += `<button onclick="loadProviders(1)">1</button>`;
  if (start > 2) html += `<span>...</span>`;
  for (let i = start; i <= end; i++) {
    html += `<button class="${i===current?'active':''}" onclick="loadProviders(${i})">${i}</button>`;
  }
  if (end < totalPages - 1) html += `<span>...</span>`;
  if (end < totalPages) html += `<button onclick="loadProviders(${totalPages})">${totalPages}</button>`;
  html += `<button ${current>=totalPages?'disabled':''} onclick="loadProviders(${current+1})">Next &raquo;</button>`;
  el.innerHTML = html;
}

function disable(btn) {
  const d = _providers[+btn.dataset.idx].domain;
  apiPost('/api/provider/disable', {domain:d, reason:'web'}).then(() => loadProviders(currentPage));
}
function enable(btn) {
  const d = _providers[+btn.dataset.idx].domain;
  apiPost('/api/provider/enable', {domain:d}).then(() => loadProviders(currentPage));
}

document.getElementById('providerSearch').addEventListener('input', debounce(() => loadProviders(1), 300));
document.getElementById('filterState').addEventListener('change', () => loadProviders(1));
document.getElementById('sortBy').addEventListener('change', () => loadProviders(1));

loadProviders(1);
</script>
{% endblock %}
